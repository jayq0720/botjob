name: ci

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx bdk validate --dir .
      - run: npm test
      - name: pack file list
        run: node scripts/check-pack-files.mjs
      - name: evals
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is unset; skipping evals"
            exit 0
          fi
          npx bdk eval --dir . --json --no-stream
